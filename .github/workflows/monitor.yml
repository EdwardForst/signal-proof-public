name: Monitor signal proof archive
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
  workflow_call:
    secrets:
      ARCHIVE_SOURCE_URL:
        required: true
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run monitor
        env:
          SOURCE_URL: ${{ secrets.ARCHIVE_SOURCE_URL }}
          PAGES_URL: https://edwardforst.github.io/signal-proof-public/
